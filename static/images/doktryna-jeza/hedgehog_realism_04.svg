<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgReal4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgReal4)" />
  <rect x="30" y="30" width="1140" height="690" fill="none" stroke="#eab308" stroke-width="1.5" opacity="0.5" />

  <text x="600" y="85" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="14" letter-spacing="6" fill="#facc15">KROK 4 · REALIA BEZPIECZEŃSTWA RP</text>
  <text x="600" y="125" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="30" font-weight="bold" fill="#fef08a">ZBROJNA NEUTRALNOŚĆ &amp; MOST TRANZYTOWY</text>
  <text x="600" y="155" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="14" font-style="italic" fill="#fde047">Wzór Austrii 1955 i Szwajcarii: nietykalna Oaza Pokoju zarabiająca na handlu Północ-Południe i Wschód-Zachód</text>

  <!-- Central Logistics / Railway Bridge Across the Horizon -->
  <g transform="translate(600, 420)">
    <!-- Bridge Arches -->
    <path d="M -400 60 Q -200 -20 0 60 Q 200 -20 400 60" fill="none" stroke="#ca8a04" stroke-width="4" />
    <line x1="-400" y1="60" x2="400" y2="60" stroke="#fef08a" stroke-width="3" />
    <!-- High speed trade train -->
    <rect x="-180" y="35" width="360" height="22" rx="4" fill="#52525b" stroke="#facc15" stroke-width="2" />
    <circle cx="-140" cy="50" r="3" fill="#facc15" />
    <circle cx="-100" cy="50" r="3" fill="#facc15" />
    <circle cx="100" cy="50" r="3" fill="#facc15" />
    <circle cx="140" cy="50" r="3" fill="#facc15" />
    <text x="0" y="110" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="16" font-weight="bold" fill="#fef08a">MOST LOGISTYCZNY EUROPY ŚRODKOWEJ</text>
    <text x="0" y="130" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="12" fill="#facc15">(Brak obcych baz · Bezpieczny tranzyt dóbr)</text>
  </g>

  <!-- Left: West Trade Partner Flow -->
  <g transform="translate(200, 420)">
    <circle cx="0" cy="0" r="35" fill="#27272a" stroke="#ca8a04" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="12" font-weight="bold" fill="#fef08a">ZACHÓD</text>
    <text x="0" y="55" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="12" fill="#a1a1aa">Wymiana handlowa</text>
  </g>

  <!-- Right: East Trade Partner Flow -->
  <g transform="translate(1000, 420)">
    <circle cx="0" cy="0" r="35" fill="#27272a" stroke="#ca8a04" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="12" font-weight="bold" fill="#fef08a">WSCHÓD</text>
    <text x="0" y="55" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="12" fill="#a1a1aa">Tranzyt surowców</text>
  </g>

  <!-- Doctrinal Pillar Banner -->
  <rect x="160" y="635" width="880" height="50" rx="6" fill="#18181b" fill-opacity="0.95" stroke="#ca8a04" stroke-width="1" />
  <text x="600" y="665" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="13" font-weight="bold" fill="#fef08a">DOKTRYNA: NEUTRALNOŚĆ PRZEKSZTAŁCA GEOPOLITYCZNE KLESZCZE W NIEZBĘDNY DLA ŚWIATA POMOST</text>
</svg>
