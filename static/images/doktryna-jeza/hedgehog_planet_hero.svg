<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />
  <circle cx="600" cy="380" r="340" fill="url(#sunGlow)" />

  <!-- Classical Border Frame -->
  <rect x="30" y="30" width="1140" height="690" fill="none" stroke="#78350f" stroke-width="2" opacity="0.6" />
  <rect x="42" y="42" width="1116" height="666" fill="none" stroke="#d97706" stroke-width="1" opacity="0.4" stroke-dasharray="8 4" />

  <!-- Top Inscriptions (Latin & Polish) -->
  <text x="600" y="85" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="14" letter-spacing="6" fill="#fbbf24">CANON 04 · PRZYMIERZE LEMIESZA</text>
  <text x="600" y="125" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="34" font-weight="bold" letter-spacing="4" fill="#fef3c7">DOKTRYNA JEŻA</text>
  <text x="600" y="155" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="15" font-style="italic" letter-spacing="3" fill="#d1d5db">DOCTRINA ERINACEI · INDIGESTA SUAVITAS PACIS</text>

  <!-- Ground / Hill in Woodcut Etching Style -->
  <path d="M 100 600 Q 600 520 1100 600 L 1100 680 L 100 680 Z" fill="#1c1917" stroke="#b45309" stroke-width="2" />
  <path d="M 150 620 Q 600 550 1050 620" fill="none" stroke="#78350f" stroke-width="1.5" stroke-dasharray="5 5" />
  <path d="M 200 640 Q 600 580 1000 640" fill="none" stroke="#451a03" stroke-width="1" />

  <!-- The Vigilant Hedgehog (Centerpiece) -->
  <g transform="translate(600, 480)">
    <!-- Quills array (stalwart, sharp, steel-like spines) -->
    <!-- Layer 1: Long outer quills -->
    <path d="M -160 -40 L -210 -90 M -130 -80 L -180 -150 M -90 -120 L -120 -200 M -40 -140 L -60 -230 M 10 -150 L 10 -240 M 60 -140 L 80 -230 M 110 -120 L 150 -200 M 150 -80 L 200 -140 M 170 -30 L 230 -70" stroke="#fef3c7" stroke-width="3" stroke-linecap="round" />
    <!-- Layer 2: Medium quills -->
    <path d="M -140 -20 L -220 -40 M -120 -60 L -190 -110 M -70 -100 L -100 -180 M -20 -120 L -30 -210 M 30 -120 L 40 -210 M 80 -100 L 120 -170 M 130 -60 L 180 -110 M 140 -20 L 210 -40" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" />
    <!-- Layer 3: Dense spine fortress -->
    <ellipse cx="0" cy="-40" rx="160" ry="110" fill="#27272a" stroke="#d97706" stroke-width="3" />
    <path d="M -120 -30 Q 0 -130 120 -30 Q 60 40 -120 -30 Z" fill="#3f3f46" />
    
    <!-- Hedgehog Snout and Head (Vigilant, wise, calm) -->
    <path d="M 120 -20 C 160 -10 190 0 210 15 C 190 25 150 25 120 15 Z" fill="#52525b" stroke="#a1a1aa" stroke-width="1.5" />
    <!-- Eye (Golden, calm, vigilant) -->
    <circle cx="150" cy="5" r="4" fill="#fbbf24" filter="url(#glow)" />
    <!-- Nose tip -->
    <circle cx="210" cy="15" r="3.5" fill="#18181b" />
    <!-- Sturdy Paws grounded on the earth -->
    <path d="M 90 25 C 95 40 105 45 115 45" stroke="#a1a1aa" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M -80 25 C -75 40 -65 45 -55 45" stroke="#a1a1aa" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- Philosophical Latin & Polish Inscription at Bottom -->
  <rect x="220" y="615" width="760" height="60" rx="8" fill="#18181b" fill-opacity="0.9" stroke="#b45309" stroke-width="1" />
  <text x="600" y="640" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="15" font-weight="bold" fill="#fef3c7">„NIE JESTEŚMY DRAPIEŻNIKIEM, LECZ JEŻEM NIE DO POŁKNIĘCIA”</text>
  <text x="600" y="660" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="12" fill="#d97706">Asymetria kosztu ponad imperialną pychą · Zbrojna neutralność i suwerenność Rzeczypospolitej</text>
</svg>
