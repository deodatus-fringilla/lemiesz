<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgOak)" />
  <rect x="30" y="30" width="1140" height="690" fill="none" stroke="#059669" stroke-width="1.5" opacity="0.5" />
  
  <text x="600" y="85" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="14" letter-spacing="6" fill="#34d399">KROK 1 · ALEGORIA LEŚNA (CANON 04)</text>
  <text x="600" y="125" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="30" font-weight="bold" fill="#ecfdf5">JEŻ GOSPODARZ POD DĘBEM</text>
  <text x="600" y="155" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="14" font-style="italic" fill="#a7f3d0">Zwyczajna praca, troska o gniazdo i gromadzenie zapasów przed zimą</text>

  <!-- Ancient Oak Trunk & Gnarled Roots -->
  <path d="M 200 150 Q 300 400 150 700 L 400 700 Q 350 450 320 150 Z" fill="#1e293b" stroke="#334155" stroke-width="3" />
  <path d="M 320 500 Q 500 560 650 680" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" />
  <path d="M 220 550 Q 100 620 50 700" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" />

  <!-- Forest Ground with Acorns and Dry Leaves -->
  <path d="M 50 620 Q 600 580 1150 620 L 1150 700 L 50 700 Z" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
  <!-- Acorns and leaves -->
  <circle cx="520" cy="610" r="8" fill="#d97706" />
  <circle cx="540" cy="615" r="7" fill="#b45309" />
  <circle cx="480" cy="625" r="9" fill="#92400e" />

  <!-- Peaceful Working Hedgehog -->
  <g transform="translate(680, 560)">
    <ellipse cx="0" cy="0" rx="90" ry="60" fill="#334155" stroke="#10b981" stroke-width="2" />
    <!-- Spines -->
    <path d="M -70 -20 L -100 -50 M -40 -40 L -60 -80 M 0 -50 L 0 -95 M 40 -40 L 60 -80 M 70 -20 L 95 -45" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 70 10 C 95 20 115 25 125 35 C 110 45 80 40 60 30 Z" fill="#475569" />
    <circle cx="95" cy="22" r="3.5" fill="#34d399" />
    <circle cx="125" cy="35" r="3" fill="#0f172a" />
    <!-- Carrying leaf on back -->
    <path d="M -20 -55 Q 0 -85 30 -60 Q 10 -40 -20 -55 Z" fill="#d97706" opacity="0.9" />
  </g>

  <!-- Moral Banner -->
  <rect x="220" y="635" width="760" height="50" rx="6" fill="#0f172a" fill-opacity="0.95" stroke="#059669" stroke-width="1" />
  <text x="600" y="665" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="13" font-weight="bold" fill="#a7f3d0">MORAŁ: „ZANIM ZACZNIESZ MACHAĆ SZABELKĄ, UPEWNIJ SIĘ, ŻE MASZ CO DO GARNKA WŁOŻYĆ I CZYM DOM OGRZAĆ”</text>
</svg>
