<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgReal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgReal2)" />
  <rect x="30" y="30" width="1140" height="690" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.5" />

  <text x="600" y="85" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="14" letter-spacing="6" fill="#fb923c">KROK 2 · REALIA BEZPIECZEŃSTWA RP</text>
  <text x="600" y="125" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="30" font-weight="bold" fill="#ffedd5">KLESZCZE IMPERIALIZMÓW &amp; PODWÓJNY DYSTANS</text>
  <text x="600" y="155" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="14" font-style="italic" fill="#fed7aa">Odrzucenie roli frontowego zderzaka i unikanie Rapallo poprzez zrównoważoną suwerenność</text>

  <!-- Central Map Silhouette of Poland as a Bastion of Peace -->
  <g transform="translate(600, 420)">
    <!-- Map Shape outline -->
    <path d="M -140 -110 L 0 -140 L 140 -90 L 170 50 L 110 130 L -90 140 L -160 50 Z" fill="#27272a" stroke="#f97316" stroke-width="3" />
    <circle cx="0" cy="0" r="18" fill="#ea580c" />
    <text x="0" y="5" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="12" font-weight="bold" fill="#ffffff">RP</text>
    <text x="0" y="50" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="14" font-weight="bold" fill="#fed7aa">OAZA SPOKOJU</text>
  </g>

  <!-- Pincer Arrows: East Imperial Pressure -->
  <g transform="translate(970, 420)">
    <path d="M 120 0 L -80 0 M -40 -30 L -80 0 L -40 30" stroke="#dc2626" stroke-width="6" stroke-linecap="round" />
    <text x="0" y="50" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="15" font-weight="bold" fill="#fca5a5">PRESJA WSCHODNIA</text>
    <text x="0" y="70" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="12" fill="#ef4444">(Ekspansja terytorialna)</text>
  </g>

  <!-- Pincer Arrows: West Coercion Pressure -->
  <g transform="translate(230, 420)">
    <path d="M -120 0 L 80 0 M 40 -30 L 80 0 L 40 30" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" />
    <text x="0" y="50" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="15" font-weight="bold" fill="#93c5fd">PRESJA ZACHODNIA</text>
    <text x="0" y="70" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="12" fill="#60a5fa">(Wojna zastępcza / bazy)</text>
  </g>

  <!-- Doctrinal Pillar Banner -->
  <rect x="160" y="635" width="880" height="50" rx="6" fill="#18181b" fill-opacity="0.95" stroke="#f97316" stroke-width="1" />
  <text x="600" y="665" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="13" font-weight="bold" fill="#ffedd5">DOKTRYNA: RÓWNY DYSTANS STRATEGICZNY ZAPOBIEGA ROZBIOROM I CUDZYM DYKTATOM</text>
</svg>
