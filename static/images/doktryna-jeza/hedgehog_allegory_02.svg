<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPred" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgPred)" />
  <rect x="30" y="30" width="1140" height="690" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.4" />

  <text x="600" y="85" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="14" letter-spacing="6" fill="#f87171">KROK 2 · ALEGORIA LEŚNA (CANON 04)</text>
  <text x="600" y="125" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="30" font-weight="bold" fill="#fee2e2">PINCETA DWÓCH DRAPIEŻNIKÓW</text>
  <text x="600" y="155" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="14" font-style="italic" fill="#fca5a5">Niedźwiedź ze Wschodu i Wilk z Zachodu – jeż na ścieżce podwójnego dystansu</text>

  <!-- Left: West Wolf with Harness (Kuszący obietnicą sojuszu) -->
  <g transform="translate(260, 430)">
    <ellipse cx="0" cy="0" rx="140" ry="90" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
    <!-- Wolf snout & teeth -->
    <path d="M 80 0 L 170 30 L 110 50 Z" fill="#312e81" stroke="#818cf8" stroke-width="2" />
    <circle cx="110" cy="15" r="4" fill="#a5b4fc" />
    <!-- Harness / Leather straps -->
    <path d="M -50 -50 L 50 50 M -20 -70 L 80 30" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 3" />
    <text x="0" y="130" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="16" font-weight="bold" fill="#c7d2fe">ZACHÓD: WILK W UPRZĘŻY</text>
    <text x="0" y="150" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="12" fill="#a5b4fc">(Szuka wysuniętej przynęty)</text>
  </g>

  <!-- Center: The Vigilant Hedgehog standing firm -->
  <g transform="translate(600, 480)">
    <ellipse cx="0" cy="0" rx="70" ry="45" fill="#27272a" stroke="#f59e0b" stroke-width="2" />
    <!-- Quills bristling both left and right -->
    <path d="M -50 -20 L -80 -50 M -30 -35 L -45 -70 M 0 -40 L 0 -80 M 30 -35 L 45 -70 M 50 -20 L 80 -50" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="10" r="3" fill="#f59e0b" />
    <text x="0" y="70" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="14" font-weight="bold" fill="#fef3c7">JEŻ W CENTRUM</text>
  </g>

  <!-- Right: East Heavy Bear (Brutalna masa) -->
  <g transform="translate(940, 430)">
    <ellipse cx="0" cy="0" rx="160" ry="110" fill="#450a0a" stroke="#dc2626" stroke-width="2" />
    <!-- Massive jaw & fangs -->
    <path d="M -80 10 L -170 30 L -110 60 Z" fill="#7f1d1d" stroke="#ef4444" stroke-width="2" />
    <circle cx="-110" cy="20" r="4.5" fill="#f87171" />
    <text x="0" y="130" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="16" font-weight="bold" fill="#fecaca">WSCHÓD: ZWALISTY NIEDŹWIEDŹ</text>
    <text x="0" y="150" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="12" fill="#fca5a5">(Gotów zmiażdżyć łapą)</text>
  </g>

  <!-- Moral Banner -->
  <rect x="180" y="635" width="840" height="50" rx="6" fill="#18181b" fill-opacity="0.95" stroke="#ef4444" stroke-width="1" />
  <text x="600" y="665" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="13" font-weight="bold" fill="#fee2e2">MORAŁ: „GDY DWA WILKI DZIELĄ ŁUP, NAIWNY JEŻ NIE WCHODZI W SOJUSZ Z ŻADNYM, BO DLA OBU JEST TYLKO MIĘSEM”</text>
</svg>
