<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <radialGradient id="clashGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="#09090b" />
  <circle cx="600" cy="440" r="280" fill="url(#clashGlow)" />
  <rect x="30" y="30" width="1140" height="690" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.4" />

  <text x="600" y="85" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="14" letter-spacing="6" fill="#fbbf24">KROK 3 · ALEGORIA LEŚNA (CANON 04)</text>
  <text x="600" y="125" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="30" font-weight="bold" fill="#fef3c7">BARIERA BÓLU I NIESTRAWNOŚĆ</text>
  <text x="600" y="155" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="14" font-style="italic" fill="#fde68a">Najeżona kula igieł rani drapieżniki – zjedzenie jeża oznacza śmierć z udławienia</text>

  <!-- Left: Recoiling, Scratched Wolf Paw -->
  <g transform="translate(280, 440)">
    <path d="M -100 -20 Q 20 0 80 40 L 40 80 Q -40 20 -120 10 Z" fill="#312e81" stroke="#818cf8" stroke-width="2" />
    <!-- Claws retracted in shock -->
    <path d="M 80 40 L 110 50 M 75 55 L 100 75 M 60 70 L 80 95" stroke="#cbd5e1" stroke-width="3" />
    <!-- Blood drops / scratches -->
    <circle cx="60" cy="45" r="4" fill="#dc2626" />
    <circle cx="45" cy="60" r="3.5" fill="#dc2626" />
    <text x="-30" y="120" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="14" font-weight="bold" fill="#a5b4fc">PORANIONA ŁAPA WILKA</text>
  </g>

  <!-- Center: Steel-like Hedgehog Sphere of Spines -->
  <g transform="translate(600, 440)">
    <circle cx="0" cy="0" r="90" fill="#27272a" stroke="#d97706" stroke-width="3" />
    <!-- Radiating steel spines in 360 degrees -->
    <!-- Top & bottom -->
    <line x1="0" y1="-90" x2="0" y2="-170" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="90" x2="0" y2="170" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" />
    <!-- Left & right -->
    <line x1="-90" y1="0" x2="-170" y2="0" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" />
    <line x1="90" y1="0" x2="170" y2="0" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" />
    <!-- Diagonals -->
    <line x1="-65" y1="-65" x2="-130" y2="-130" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" />
    <line x1="65" y1="-65" x2="130" y2="-130" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" />
    <line x1="-65" y1="65" x2="-130" y2="130" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" />
    <line x1="65" y1="65" x2="130" y2="130" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" />
    <!-- Intermediate spines -->
    <line x1="-35" y1="-82" x2="-75" y2="-155" stroke="#f59e0b" stroke-width="3" />
    <line x1="35" y1="-82" x2="75" y2="-155" stroke="#f59e0b" stroke-width="3" />
    <line x1="-82" y1="-35" x2="-155" y2="-75" stroke="#f59e0b" stroke-width="3" />
    <line x1="82" y1="-35" x2="155" y2="-75" stroke="#f59e0b" stroke-width="3" />
    <circle cx="0" cy="0" r="30" fill="#3f3f46" stroke="#b45309" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="11" font-weight="bold" fill="#fef3c7">TARCZA</text>
  </g>

  <!-- Right: Recoiling Bleeding Bear Paw -->
  <g transform="translate(920, 440)">
    <path d="M 120 -20 Q -20 0 -80 40 L -40 80 Q 40 20 140 10 Z" fill="#7f1d1d" stroke="#ef4444" stroke-width="2" />
    <!-- Claws -->
    <path d="M -80 40 L -110 50 M -75 55 L -100 75 M -60 70 L -80 95" stroke="#cbd5e1" stroke-width="3" />
    <!-- Scratches -->
    <circle cx="-60" cy="45" r="4" fill="#dc2626" />
    <circle cx="-45" cy="60" r="3.5" fill="#dc2626" />
    <text x="30" y="120" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="14" font-weight="bold" fill="#fca5a5">ZAKRWAWIONA ŁAPA NIEDŹWIEDZIA</text>
  </g>

  <!-- Moral Banner -->
  <rect x="180" y="635" width="840" height="50" rx="6" fill="#18181b" fill-opacity="0.95" stroke="#d97706" stroke-width="1" />
  <text x="600" y="665" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="13" font-weight="bold" fill="#fef3c7">MORAŁ: „NIE MUSISZ POKONAĆ IMPERIUM W POLU – MUSISZ SPRAWIĆ, BY DOTKNIĘCIE CIĘ BOLAŁO WIĘCEJ NIŻ ZYSK”</text>
</svg>
