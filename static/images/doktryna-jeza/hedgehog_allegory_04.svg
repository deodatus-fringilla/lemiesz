<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMorning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgMorning)" />
  <rect x="30" y="30" width="1140" height="690" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4" />

  <text x="600" y="85" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="14" letter-spacing="6" fill="#34d399">KROK 4 · ALEGORIA LEŚNA (CANON 04)</text>
  <text x="600" y="125" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="30" font-weight="bold" fill="#ecfdf5">SPOKOJNY DUKT I OAZA POKOJU</text>
  <text x="600" y="155" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="14" font-style="italic" fill="#a7f3d0">Drapieżniki omijają polanę szerokim łukiem – jeż bezpiecznie wyprowadza młode</text>

  <!-- Clear Sunlit Forest Path -->
  <path d="M 450 700 L 550 400 L 650 400 L 750 700 Z" fill="#065f46" stroke="#34d399" stroke-width="1.5" />

  <!-- Hedgehog Family on the Safe Path -->
  <g transform="translate(600, 520)">
    <!-- Mother / Parent Hedgehog -->
    <ellipse cx="-40" cy="0" rx="60" ry="40" fill="#334155" stroke="#34d399" stroke-width="2" />
    <path d="M -70 -15 L -95 -35 M -45 -30 L -60 -60 M -15 -35 L -15 -65 M 10 -25 L 25 -50" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="5" r="3" fill="#34d399" />
    <!-- Baby Hedgehog 1 -->
    <ellipse cx="60" cy="15" rx="30" ry="20" fill="#475569" stroke="#6ee7b7" stroke-width="1.5" />
    <path d="M 50 0 L 40 -15 M 65 -5 L 65 -20 M 80 0 L 90 -15" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round" />
    <!-- Baby Hedgehog 2 -->
    <ellipse cx="120" cy="20" rx="24" ry="16" fill="#475569" stroke="#6ee7b7" stroke-width="1.5" />
    <path d="M 115 10 L 110 -5 M 125 5 L 125 -10" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Distant Shadows of Predators Bypassing Harmlessly -->
  <g transform="translate(180, 360)">
    <ellipse cx="0" cy="0" rx="60" ry="30" fill="#064e3b" opacity="0.6" stroke="#047857" stroke-width="1" />
    <text x="0" y="50" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="12" fill="#6ee7b7">Bypass zachodni (daleko)</text>
  </g>
  <g transform="translate(1020, 360)">
    <ellipse cx="0" cy="0" rx="70" ry="35" fill="#064e3b" opacity="0.6" stroke="#047857" stroke-width="1" />
    <text x="0" y="50" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="12" fill="#6ee7b7">Bypass wschodni (daleko)</text>
  </g>

  <!-- Moral Banner -->
  <rect x="180" y="635" width="840" height="50" rx="6" fill="#022c22" fill-opacity="0.95" stroke="#10b981" stroke-width="1" />
  <text x="600" y="665" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="13" font-weight="bold" fill="#ecfdf5">MORAŁ: „NAJWYŻSZĄ SZTUKĄ WOJNY JEST ZACHOWANIE POKOJU DZIĘKI SILE WŁASNYCH KOLCÓW I MĄDROŚCI ROZUMU”</text>
</svg>
