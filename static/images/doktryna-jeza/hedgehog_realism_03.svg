<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgReal3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgReal3)" />
  <rect x="30" y="30" width="1140" height="690" fill="none" stroke="#eab308" stroke-width="1.5" opacity="0.5" />

  <text x="600" y="85" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="14" letter-spacing="6" fill="#facc15">KROK 3 · REALIA BEZPIECZEŃSTWA RP</text>
  <text x="600" y="125" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="30" font-weight="bold" fill="#fef08a">ASYMETRYCZNE NASYCENIE TERENU</text>
  <text x="600" y="155" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="14" font-style="italic" fill="#fde047">Rój polskich dronów, obrona terytorialna, fortyfikacje i schrony dla 100% ludności</text>

  <!-- Defensive Infrastructure Silhouettes -->
  <!-- Left: Anti-tank hedgehogs (Czech hedgehogs / Stalowe kozły) -->
  <g transform="translate(250, 470)">
    <line x1="-50" y1="50" x2="50" y2="-50" stroke="#71717a" stroke-width="8" stroke-linecap="round" />
    <line x1="-50" y1="-50" x2="50" y2="50" stroke="#71717a" stroke-width="8" stroke-linecap="round" />
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#a1a1aa" stroke-width="8" stroke-linecap="round" />
    <text x="0" y="90" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="14" font-weight="bold" fill="#fde047">ZAPORY INŻYNIERYJNE</text>
  </g>

  <!-- Center: Swarm of Territorial Defense Drones (Rój dronów FPV & rozpoznania) -->
  <g transform="translate(600, 390)">
    <!-- Main Command Drone -->
    <path d="M 0 -20 L 40 0 L 0 20 L -40 0 Z" fill="#ca8a04" stroke="#fef08a" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#ef4444" />
    <!-- Rotor arms -->
    <line x1="-40" y1="-25" x2="40" y2="25" stroke="#fef08a" stroke-width="2" />
    <line x1="-40" y1="25" x2="40" y2="-25" stroke="#fef08a" stroke-width="2" />
    <circle cx="-40" cy="-25" r="8" fill="none" stroke="#fef08a" stroke-width="1.5" />
    <circle cx="40" cy="25" r="8" fill="none" stroke="#fef08a" stroke-width="1.5" />
    <circle cx="-40" cy="25" r="8" fill="none" stroke="#fef08a" stroke-width="1.5" />
    <circle cx="40" cy="-25" r="8" fill="none" stroke="#fef08a" stroke-width="1.5" />
    <!-- Smaller drones in swarm -->
    <circle cx="-120" cy="-60" r="5" fill="#facc15" />
    <circle cx="120" cy="-50" r="5" fill="#facc15" />
    <circle cx="-80" cy="70" r="4" fill="#facc15" />
    <circle cx="90" cy="80" r="4" fill="#facc15" />
    <text x="0" y="110" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="16" font-weight="bold" fill="#fef08a">RÓJ DRONÓW &amp; OBRONA POWSZECHNA</text>
    <text x="0" y="130" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="12" fill="#facc15">(Tani koszt własny · Miażdżący koszt agresora)</text>
  </g>

  <!-- Right: Reinforced Civil Defense Bunker & Shelters (100% ludności) -->
  <g transform="translate(950, 460)">
    <path d="M -80 40 L -60 -40 L 60 -40 L 80 40 Z" fill="#3f3f46" stroke="#ca8a04" stroke-width="3" />
    <rect x="-25" y="-10" width="50" height="50" fill="#18181b" stroke="#71717a" stroke-width="2" />
    <text x="0" y="90" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="14" font-weight="bold" fill="#fde047">SCHRONY CYWILNE</text>
  </g>

  <!-- Doctrinal Pillar Banner -->
  <rect x="160" y="635" width="880" height="50" rx="6" fill="#18181b" fill-opacity="0.95" stroke="#ca8a04" stroke-width="1" />
  <text x="600" y="665" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="13" font-weight="bold" fill="#fef08a">DOKTRYNA: NIE POTRZEBUJEMY SPARTY – KOSZT AGRESJI NA POLSKĘ MUSI BYĆ DLA KAŻDEGO SAMOBÓJSTWEM</text>
</svg>
