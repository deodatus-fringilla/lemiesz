# One image, two deployment modes (see docs/implementation_plan.md §8.1).
#
# Mode B (local machine / Tailscale):  docker compose up -d
#   Set ORIGIN=http://<tailscale-ip>:3000 and APP_BIND to the machine's Tailscale IP (or 0.0.0.0 on a trusted LAN) in .env.
#   The default binds to 127.0.0.1 only.
#
# Mode A (VPS, automatic HTTPS):        docker compose --profile vps up -d
#   Keep APP_BIND=127.0.0.1, set DOMAIN, ORIGIN=https://<domain>,
#   ADDRESS_HEADER=X-Forwarded-For and XFF_DEPTH=1 in .env.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lemiesz-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      DATABASE_PATH: /data/lemiesz.db
      # Required behind a reverse proxy so SvelteKit's CSRF origin check and client IPs work
      ORIGIN: ${ORIGIN:-}
      ADDRESS_HEADER: ${ADDRESS_HEADER:-}
      XFF_DEPTH: ${XFF_DEPTH:-1}
    volumes:
      # Persistent LOCAL volume for the SQLite WAL database
      - lemiesz-data:/data
    ports:
      - "${APP_BIND:-127.0.0.1}:3000:3000"

  # Reverse proxy for Mode A only
  caddy:
    image: caddy:2-alpine
    container_name: lemiesz-caddy
    restart: unless-stopped
    profiles:
      - vps
    environment:
      DOMAIN: ${DOMAIN:-lemiesz.local}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  lemiesz-data:
  caddy-data:
  caddy-config:
