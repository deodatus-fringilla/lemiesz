name: Eval

# Retrieval quality with the real local embedder, plus the auditor half when the LLM secrets are set.
# Not on every push: it downloads a ~100 MB embedding model, and the auditor half calls a paid API.
# Missing secrets are not an error: the auditor half is then skipped, as it is locally.

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  eval:
    name: pnpm eval
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLM_AUDITOR_BASE_URL: ${{ secrets.LLM_AUDITOR_BASE_URL }}
      LLM_AUDITOR_API_KEY: ${{ secrets.LLM_AUDITOR_API_KEY }}
      LLM_AUDITOR_MODEL: ${{ secrets.LLM_AUDITOR_MODEL }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run eval
        run: pnpm eval

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: data/eval-report.txt
          if-no-files-found: warn
